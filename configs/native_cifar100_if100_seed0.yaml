# Seed-0 comparison that includes the T2H objective.
experiment:
  name: ccua_cifar100_if100_seed0_v1
  protocol: native_cifar_v1
  output_group: c100_if100_baselines
  seeds: [0]

methods:
  - {name: ddpm, objective: ddpm}
  - {name: cbdm, objective: cbdm, cb_tau: 1.0}
  - {name: t2h, objective: t2h}

repository:
  directory: CCUA-DDPM
  commit: baff9def6cfd553d4452d10eab0bac66ec2727aa

dataset:
  name: cifar100lt_if100
  data_type: cifar100lt
  root: "${LTX_DATA_ROOT:-./data}"
  imbalance_factor: 0.01
  split_seed: 0
  num_class: 100
  img_size: 32

train:
  total_steps: 300000
  batch_size: 64
  lr: 0.0002
  warmup: 5000
  T: 1000
  beta_1: 0.0001
  beta_T: 0.02
  var_type: fixedlarge
  dropout: 0.1
  grad_clip: 1.0
  num_workers: 4
  save_step: 25000
  sample_step: 100000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999

evaluation:
  checkpoint_step: 300000
  num_images: 50000
  sample_batch_size: 64
  inception_batch_size: 64
  guidance_scale: 1.5
  sample_method: ddim
  ddim_skip_step: 10
  uniform_labels: true
  paper_metrics: true
