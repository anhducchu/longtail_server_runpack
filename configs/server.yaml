machine:
  gpu_ids: auto                 # e.g. [0,1,2,3,4,5,6,7]
  max_concurrent: auto          # auto = sum of per-GPU slots below
  # Never launch a new task into a shared GPU with less than one native
  # training footprint available.  Zero allowed the scheduler to start a
  # 12-GB job on a card with only a few hundred MB free, causing avoidable
  # OOM retries when another tenant was using the device.
  min_free_gpu_memory_gb: 12
  poll_seconds: 20
  heartbeat_seconds: 30
  # Native campaigns keep each 50k checkpoint (~0.6 GB) plus their 50k sample
  # array for lineage/resume auditing. Pause launching rather than fill the
  # disk and lose a run mid-training; 0 disables.
  disk_stop_free_gb: 20
  shutdown_grace_seconds: 45
  # How many tasks may share one GPU. "auto" divides each GPU's free memory
  # (minus gpu_memory_headroom_gb) by task_gpu_memory_gb, capped at
  # max_tasks_per_gpu. Override with an integer to pin every GPU to that count.
  tasks_per_gpu: auto
  max_tasks_per_gpu: 4
  # "auto" starts at 12 GB and self-corrects once a task's real footprint is
  # observed (runs/<campaign>/**/gpu_footprint.json). Override with a number
  # to skip the self-correction.
  task_gpu_memory_gb: auto
  gpu_memory_headroom_gb: 4
  # nvidia-smi free-memory readings lag a freshly started task by a minute or
  # two; staggering launches onto the same GPU avoids reading stale headroom
  # and over-packing into an OOM.
  same_gpu_launch_stagger_seconds: 120
  # Dataloader workers per task are divided across however many tasks share
  # the machine's CPUs right now, so packing GPUs doesn't oversubscribe CPU.
  max_dataloader_workers: 8

runtime:
  python: python
  repos_root: ${LTX_REPOS_ROOT:-./third_party}
  runs_root: ${LTX_RUNS_ROOT:-./runs}
  data_root: ${LTX_DATA_ROOT:-./data}
  wandb_project: ${WANDB_PROJECT:-longtail}
  wandb_entity: ${WANDB_ENTITY:-}
  wandb_mode: ${WANDB_MODE:-online}
  log_system_every_seconds: 30
  # tqdm redraws its bar several times a second, and with the output
  # piped every redraw becomes its own record: a 31-hour training phase
  # wrote ~300k of them into stdout.log and the W&B artifact. Keep one
  # redraw per this many seconds (0 keeps them all); tqdm_min_interval
  # applies the same thinning inside the child process.
  progress_log_every_seconds: 30
  tqdm_min_interval_seconds: 10
  log_tensorboard_every_seconds: 60
  upload_sample_grids: true
  upload_final_checkpoint: false
  upload_stdout_artifact: true
  fail_on_dirty_repo: false

retry:
  max_attempts: 2
  retry_exit_codes: [1, 137, 143]
  # A phase terminated by SIGKILL cannot be caught by Python.  The scheduler
  # therefore requeues it transparently and the CCUA adapter resumes the most
  # recent complete local checkpoint.  This is deliberately visible in the
  # state DB and launcher logs; it is not a hidden supervisor.
  auto_resume_exit_codes: [-9, 137]
  auto_resume_max_attempts: 8
  # Cap an otherwise large upstream save interval so a killed job loses only
  # a bounded amount of work.  Existing smaller per-campaign intervals win.
  checkpoint_interval_steps: 25000
  retry_delay_seconds: 60
  oom_batch_sizes: [128, 96, 64, 48, 32]
