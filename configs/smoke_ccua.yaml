# Infrastructure smoke only; these settings are not scientific evidence.
experiment:
  name: smoke_ccua_v1
  protocol: smoke
  output_group: smoke_ccua
  seeds: [0]

methods:
  - {name: ccua, objective: ccua, ccua_al: 1.0, ccua_ucl: 1.0}

repository:
  directory: CCUA-DDPM
  commit: baff9def6cfd553d4452d10eab0bac66ec2727aa

dataset:
  name: cifar100lt_smoke
  data_type: cifar100lt
  root: "${LTX_DATA_ROOT:-./data}"
  imbalance_factor: 0.01
  num_class: 100
  img_size: 32

train:
  total_steps: 20
  batch_size: 16
  lr: 0.0002
  warmup: 5000
  T: 1000
  dropout: 0.1
  num_workers: 2
  save_step: 10
  sample_step: 1000
  ch: 128
  ch_mult: [1, 2, 2, 2]
  attn: [1]
  num_res_blocks: 2
  ema_decay: 0.9999

evaluation:
  checkpoint_step: 20
  num_images: 64
  sample_batch_size: 32
  guidance_scale: 1.0
  sample_method: ddpm
  ddim_skip_step: 100
  uniform_labels: true
  paper_metrics: false
