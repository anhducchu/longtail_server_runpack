[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longtail-deadline-runpack"
version = "0.1.0"
description = "Auditable multi-GPU runner for long-tail diffusion experiments"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "psutil>=5.9",
  "wandb>=0.17",
  "tensorboard>=2.14",
  "numpy>=1.24",
]

[project.scripts]
ltx = "ltx.cli:main"

[tool.setuptools.packages.find]
include = ["ltx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
