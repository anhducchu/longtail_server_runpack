# Screening configuration. This experiment never writes outside scaffold/outputs/.
experiment:
  name: frozen_score_scaffold
  seed: 20260925

dataset:
  root: "${LTX_DATA_ROOT:-data}"
  imbalance_factor: 0.01
  split_seed: 0
  num_classes: 100
  image_size: 32

diffusion:
  steps: 1000
  beta_1: 0.0001
  beta_T: 0.02

model:
  checkpoint_key: ema_model
  channels: 128
  channel_multipliers: [1, 2, 2, 2]
  attention_levels: [1]
  residual_blocks: 2
  dropout: 0.1
  microbatch: 4

training:
  updates: 200
  batch_size: 2
  stride: 50
  hidden_width: 32
  learning_rate: 0.001
  rarity_weight_exponent: 1.0
  rho_min: 0.05
  rho_max: 2.0
  budget_weight: 2.0
  prior_weight: 0.1
  budget_time_samples: 32
  prior_projections: 32
  gradient_clip: 1.0
  save_every: 10
  log_every: 5

sampling:
  # Screening only. Set to 50000 before running the canonical evaluator.
  num_images: 10000
  batch_size: 16
  stride: 10
  seed: 20260926

evaluation:
  enabled: false
  metrics_root: "${LTX_METRICS_ROOT:-third_party/CCUA-DDPM/stats}"
  device: cuda
  inception_batch_size: 16
