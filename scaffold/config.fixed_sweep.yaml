# Canonical fixed A/A0 sweep on one frozen EMA-DDPM checkpoint.
experiment:
  name: ddpm_300k_fixed_a_sweep
  kind: fixed_sweep
  seed: 20260925

dataset:
  root: "${LTX_DATA_ROOT:-data}"
  imbalance_factor: 0.01
  split_seed: 0
  num_classes: 100
  image_size: 32

diffusion:
  steps: 1000
  beta_1: 0.0001
  beta_T: 0.02

model:
  checkpoint_key: ema_model
  channels: 128
  channel_multipliers: [1, 2, 2, 2]
  attention_levels: [1]
  residual_blocks: 2
  dropout: 0.1
  # Five parallel workers fit beside the other shared H100 jobs at this size.
  microbatch: 256

# Required by the shared config schema; fixed-sweep never uses these values.
training:
  updates: 0
  batch_size: 1
  stride: 50
  hidden_width: 32
  learning_rate: 0.001
  rarity_weight_exponent: 1.0
  rho_min: 0.05
  rho_max: 2.0
  budget_weight: 2.0
  prior_weight: 0.1
  budget_time_samples: 32
  prior_projections: 32
  gradient_clip: 1.0
  save_every: 10
  log_every: 5

sampling:
  num_images: 50000
  batch_size: 256
  stride: 10
  seed: 20260926
  # Matches CCUA-DDPM's omega convention, not the alternative CFG scale form.
  guidance_scale: 1.5

evaluation:
  enabled: true
  metrics_root: "${LTX_METRICS_ROOT:-third_party/CCUA-DDPM/stats}"
  device: cuda
  inception_batch_size: 128
